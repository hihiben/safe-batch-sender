name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # This XSS surface only has one mechanical guarantee: nothing ever writes
      # untrusted content through innerHTML. Grep for it so a regression fails CI
      # instead of shipping.
      - name: Forbid unsafe DOM sinks
        run: |
          if grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write|eval\(|new Function\(' src/; then
            echo "Found a forbidden DOM sink in src/ — render.ts must only use textContent." >&2
            exit 1
          fi
